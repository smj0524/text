<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Task Tracker</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

    <main class="bg-white/80 backdrop-blur-xl w-full max-w-md rounded-[2rem] shadow-2xl overflow-hidden border border-white/50">
        
        <!-- Header Section -->
        <header class="p-8 pb-6 border-b border-slate-100">
            <div class="flex items-center justify-between mb-2">
                <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">My Tasks</h1>
                <span id="taskCount" class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full">0 tasks</span>
            </div>
            <p class="text-slate-500 text-sm">Stay organized, focused, and productive.</p>
        </header>

        <!-- Input Section -->
        <div class="p-8 pb-4">
            <div class="flex gap-3">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="What needs to be done?" 
                    class="flex-1 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-2xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 block w-full p-4 transition-all duration-300 outline-none placeholder:text-slate-400"
                >
                <button 
                    id="addBtn" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-2xl px-6 py-4 transition-all duration-300 shadow-lg shadow-indigo-200 active:scale-95 flex items-center justify-center"
                    aria-label="Add Task"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"></path></svg>
                </button>
            </div>
            <!-- Error message container (hidden by default) -->
            <p id="errorMsg" class="text-rose-500 text-xs mt-2 ml-2 hidden transition-all">Please enter a task before adding.</p>
        </div>

        <!-- Task List Section -->
        <div class="px-8 pb-8">
            <ul id="taskList" class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                <!-- Tasks will be dynamically injected here -->
            </ul>
            
            <!-- Empty State -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-10 text-center opacity-70">
                <div class="bg-indigo-50 p-4 rounded-full mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-indigo-300" fill="currentColor" viewBox="0 0 256 256"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200Zm-45.66-90.34a8,8,0,0,1,0,11.32l-48,48a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L116,146.34l42.34-42.34A8,8,0,0,1,170.34,109.66Z"></path></svg>
                </div>
                <p class="text-slate-500 text-sm">All caught up!<br>Add a new task to get started.</p>
            </div>
        </div>
    </main>

    <script>
        // DOM Elements
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const taskCount = document.getElementById('taskCount');
        const errorMsg = document.getElementById('errorMsg');

        // State: Load from Local Storage or initialize empty
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        // Render tasks to the UI
        function renderTasks() {
            // Clear current list
            taskList.innerHTML = '';

            // Update Header Count
            const remaining = tasks.filter(t => !t.completed).length;
            taskCount.textContent = `${remaining} task${remaining !== 1 ? 's' : ''}`;

            // Show or hide empty state
            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            // Create and append list items
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `group flex items-center justify-between p-4 rounded-2xl border transition-all duration-300 ${
                    task.completed 
                    ? 'bg-slate-50 border-transparent shadow-none opacity-60' 
                    : 'bg-white border-slate-100 shadow-sm hover:shadow-md hover:border-indigo-100 cursor-pointer'
                }`;

                // Left side (Checkbox + Text)
                const leftDiv = document.createElement('div');
                leftDiv.className = 'flex items-center gap-3 cursor-pointer flex-1';
                leftDiv.onclick = () => toggleTask(index);

                // Checkbox simulation
                const checkCircle = document.createElement('div');
                checkCircle.className = `w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors duration-200 ${
                    task.completed 
                    ? 'bg-indigo-500 border-indigo-500' 
                    : 'border-slate-300 group-hover:border-indigo-400'
                }`;
                
                if (task.completed) {
                    checkCircle.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>`;
                }

                // Text
                const textSpan = document.createElement('span');
                textSpan.textContent = task.text;
                textSpan.className = `text-sm font-medium transition-all ${
                    task.completed ? 'line-through text-slate-400' : 'text-slate-700'
                }`;

                leftDiv.appendChild(checkCircle);
                leftDiv.appendChild(textSpan);

                // Right side (Delete Button)
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'text-slate-300 hover:text-rose-500 hover:bg-rose-50 p-2 rounded-xl transition-all duration-200 opacity-0 group-hover:opacity-100 focus:opacity-100';
                deleteBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"></path></svg>`;
                deleteBtn.onclick = (e) => {
                    e.stopPropagation(); // Prevent triggering the toggle
                    deleteTask(index);
                };

                li.appendChild(leftDiv);
                li.appendChild(deleteBtn);
                taskList.appendChild(li);
            });

            // Save to Local Storage
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Add new task
        function addTask() {
            const text = taskInput.value.trim();
            
            if (text === '') {
                // Show simple inline error instead of ugly alert()
                errorMsg.classList.remove('hidden');
                taskInput.classList.add('border-rose-400', 'focus:ring-rose-500/20', 'focus:border-rose-500');
                taskInput.classList.remove('focus:ring-indigo-500/20', 'focus:border-indigo-500');
                return;
            }

            // Hide error if present
            errorMsg.classList.add('hidden');
            taskInput.classList.remove('border-rose-400', 'focus:ring-rose-500/20', 'focus:border-rose-500');
            taskInput.classList.add('focus:ring-indigo-500/20', 'focus:border-indigo-500');

            tasks.push({
                text: text,
                completed: false,
                id: Date.now()
            });
            
            taskInput.value = ''; // Clear input
            renderTasks();
        }

        // Toggle task completion status
        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        // Delete task
        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        // Event Listeners
        addBtn.addEventListener('click', addTask);
        
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
            // Hide error on typing
            if (e.key !== 'Enter' && !errorMsg.classList.contains('hidden')) {
                errorMsg.classList.add('hidden');
                taskInput.classList.remove('border-rose-400', 'focus:ring-rose-500/20', 'focus:border-rose-500');
                taskInput.classList.add('focus:ring-indigo-500/20', 'focus:border-indigo-500');
            }
        });

        // Initial Render
        renderTasks();

    </script>
</body>
</html>
